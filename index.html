<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/login.css">
    <title>Pricetag</title>
</head>
<body>
    <main>
        <section id="formulario">
            <!--Logo Placeholder-->
            <span id="logo">
                
            </span>

            <!--Inputs de login-->
            <div class="info" id="login">
                <p>Login</p>
                <input type="text">
            </div>
            <div class="info" id="senha">
                <p>Senha</p>
                <input type="password" name="password" id="pass">
            </div>

            <!--Checkbox de conectado-->
            <div class="check">
                <input type="checkbox" name="conect" id="conectado">
                <label for="conectado">Permanecer conectado</label>
            </div>

            <!--Botão de Entrar-->
            <div id="botao-entrar">
                <button type="submit">Entrar</button>
            </div>
        </section>
    </main>
</body>
</html>
